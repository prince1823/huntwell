<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Job Hunt Auto-Apply</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151c;
    --border: #232733;
    --text: #e6e8ec;
    --muted: #8b93a7;
    --accent: #5b8cff;
    --applied: #2fbf71;
    --skipped: #6b7280;
    --review: #e8a33d;
    --failed: #e8543d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }

  #upload-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    text-align: center;
  }
  #drop {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 40px 20px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  #drop.drag { border-color: var(--accent); }
  #drop p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  #drop .icon { font-size: 32px; }
  #file-input { display: none; }
  #filename { margin-top: 14px; font-size: 14px; color: var(--accent); min-height: 20px; }
  button#start {
    margin-top: 18px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 28px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    opacity: 0.4;
    pointer-events: none;
    transition: opacity 0.15s;
  }
  button#start.ready { opacity: 1; pointer-events: auto; }

  #progress {
    display: none;
    margin: 32px 0;
  }
  .steps { display: flex; gap: 8px; margin-bottom: 28px; }
  .step {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .step .n {
    display: inline-flex;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--border);
    color: var(--muted);
    align-items: center;
    justify-content: center;
    font-size: 11px;
    margin-right: 8px;
  }
  .step.active { border-color: var(--accent); color: var(--text); }
  .step.active .n { background: var(--accent); color: white; }
  .step.done { border-color: var(--applied); color: var(--text); }
  .step.done .n { background: var(--applied); color: white; }

  #profile-card {
    display: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 20px;
    font-size: 13px;
  }
  #profile-card b { color: var(--text); }
  .skill-pill {
    display: inline-block;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
    margin: 3px 4px 0 0;
    font-size: 12px;
    color: var(--muted);
  }

  .platform-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .pcol {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
  }
  .pcol h3 { margin: 0 0 6px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  .pcol .status { color: var(--muted); font-size: 12px; }
  .pcol .err { color: var(--failed); font-size: 12px; margin-top: 6px; }
  .spinner {
    width: 12px; height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #results { display: flex; flex-direction: column; gap: 8px; }
  .result-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
  }
  .result-card.applied { border-left-color: var(--applied); }
  .result-card.needs_review { border-left-color: var(--review); }
  .result-card.failed { border-left-color: var(--failed); }
  .result-card.skipped { border-left-color: var(--skipped); opacity: 0.6; }
  .result-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .result-title { font-size: 14px; font-weight: 600; }
  .result-company { color: var(--muted); font-size: 13px; }
  .badge {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 700;
  }
  .badge.applied { background: rgba(47,191,113,0.15); color: var(--applied); }
  .badge.needs_review { background: rgba(232,163,61,0.15); color: var(--review); }
  .badge.failed { background: rgba(232,84,61,0.15); color: var(--failed); }
  .badge.skipped { background: rgba(107,114,128,0.15); color: var(--skipped); }
  .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .jd-toggle { font-size: 12px; color: var(--accent); cursor: pointer; margin-top: 6px; display: inline-block; }
  .jd-text { display: none; font-size: 12px; color: var(--muted); margin-top: 8px; white-space: pre-wrap; max-height: 160px; overflow-y: auto; border-top: 1px solid var(--border); padding-top: 8px; }
  .jd-text.open { display: block; }
  .reason { font-size: 12px; color: var(--review); margin-top: 4px; }

  #done-banner { display: none; margin-top: 20px; padding: 12px 16px; background: rgba(47,191,113,0.1); border: 1px solid var(--applied); border-radius: 8px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Job Hunt Auto-Apply</h1>
  <p class="sub">Upload a resume and watch it get parsed, scored, and applied across LinkedIn, Wellfound &amp; Ashby.</p>

  <div id="upload-card">
    <div id="drop">
      <div class="icon">&#128196;</div>
      <p>Click to choose a resume, or drag one here (PDF / DOCX / TXT)</p>
    </div>
    <input type="file" id="file-input" accept=".pdf,.docx,.txt" />
    <div id="filename"></div>
    <button id="start">Start</button>
  </div>

  <div id="progress">
    <div class="steps">
      <div class="step" id="step-1"><span class="n">1</span>Extracting resume</div>
      <div class="step" id="step-2"><span class="n">2</span>Scoring with AI</div>
      <div class="step" id="step-3"><span class="n">3</span>Applying</div>
    </div>

    <div id="profile-card"></div>

    <div class="platform-cols" id="platform-cols"></div>

    <div id="results"></div>

    <div id="done-banner"></div>
  </div>
</div>

<script>
const dropEl = document.getElementById('drop');
const fileInput = document.getElementById('file-input');
const filenameEl = document.getElementById('filename');
const startBtn = document.getElementById('start');
let chosenFile = null;

dropEl.addEventListener('click', () => fileInput.click());
dropEl.addEventListener('dragover', (e) => { e.preventDefault(); dropEl.classList.add('drag'); });
dropEl.addEventListener('dragleave', () => dropEl.classList.remove('drag'));
dropEl.addEventListener('drop', (e) => {
  e.preventDefault();
  dropEl.classList.remove('drag');
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) setFile(fileInput.files[0]); });

function setFile(f) {
  chosenFile = f;
  filenameEl.textContent = f.name;
  startBtn.classList.add('ready');
}

const PLATFORM_LABELS = { linkedin: 'LinkedIn', wellfound: 'Wellfound', ashby: 'Ashby' };
const platformState = {};

startBtn.addEventListener('click', async () => {
  if (!chosenFile) return;
  startBtn.classList.remove('ready');
  document.getElementById('upload-card').style.display = 'none';
  document.getElementById('progress').style.display = 'block';

  const form = new FormData();
  form.append('resume', chosenFile);
  const res = await fetch('/api/run', { method: 'POST', body: form });
  const { run_id } = await res.json();

  const es = new EventSource(`/api/stream/${run_id}`);
  es.onmessage = (ev) => {
    const evt = JSON.parse(ev.data);
    handleEvent(evt);
    // EventSource auto-reconnects on any connection close by default; once
    // the run is actually finished (or the server reports an error), the
    // server has discarded this run_id, so a reconnect attempt would just
    // fail with "unknown run_id". Close it explicitly instead.
    if (evt.type === 'done' || evt.type === 'error') es.close();
  };
  es.onerror = () => es.close();
});

function setStep(n) {
  for (let i = 1; i <= 3; i++) {
    const el = document.getElementById(`step-${i}`);
    el.classList.remove('active', 'done');
    if (i < n) el.classList.add('done');
    if (i === n) el.classList.add('active');
  }
}

function ensurePlatformCol(platform) {
  if (platformState[platform]) return platformState[platform];
  const container = document.getElementById('platform-cols');
  const col = document.createElement('div');
  col.className = 'pcol';
  col.innerHTML = `<h3>${PLATFORM_LABELS[platform] || platform} <span class="spinner"></span></h3><div class="status">starting…</div><div class="err"></div>`;
  container.appendChild(col);
  const state = { col, applied: 0, reviewed: 0, failed: 0, skipped: 0 };
  platformState[platform] = state;
  return state;
}

function updatePlatformStatus(platform) {
  const s = platformState[platform];
  if (!s) return;
  s.col.querySelector('.status').textContent =
    `applied ${s.applied} · needs review ${s.reviewed} · skipped ${s.skipped} · failed ${s.failed}`;
}

function handleEvent(evt) {
  switch (evt.type) {
    case 'step':
      setStep(evt.step);
      break;
    case 'profile': {
      const card = document.getElementById('profile-card');
      card.style.display = 'block';
      const skills = (evt.skills || []).map(s => `<span class="skill-pill">${escapeHtml(s)}</span>`).join('');
      card.innerHTML = `<b>${escapeHtml(evt.name)}</b> &middot; ${escapeHtml(evt.headline)} &middot; ${evt.years_of_experience} yrs experience<br/>${skills}`;
      break;
    }
    case 'platform_start':
      ensurePlatformCol(evt.platform);
      break;
    case 'platform_search': {
      const s = ensurePlatformCol(evt.platform);
      s.col.querySelector('.status').textContent = `found ${evt.count} candidate postings — applying…`;
      break;
    }
    case 'platform_error': {
      const s = ensurePlatformCol(evt.platform);
      s.col.querySelector('.err').textContent = evt.message;
      break;
    }
    case 'platform_skipped': {
      const s = ensurePlatformCol(evt.platform);
      s.col.querySelector('.status').textContent = evt.message;
      break;
    }
    case 'platform_done': {
      const s = platformState[evt.platform];
      if (s) {
        const spinner = s.col.querySelector('.spinner');
        if (spinner) spinner.remove();
        // Always refresh the status line on completion rather than leaving
        // whatever text was last set (e.g. "found N — applying…") -- some
        // postings can be filtered out (already applied before, excluded
        // keyword) without a visible event for each one, which otherwise
        // leaves the card looking permanently stuck mid-run.
        if (!s.col.querySelector('.err').textContent) updatePlatformStatus(evt.platform);
      }
      break;
    }
    case 'result':
      addResult(evt);
      break;
    case 'error': {
      const banner = document.getElementById('done-banner');
      banner.style.display = 'block';
      banner.style.background = 'rgba(232,84,61,0.1)';
      banner.style.borderColor = 'var(--failed)';
      banner.textContent = 'Error: ' + evt.message;
      break;
    }
    case 'done': {
      setStep(4);
      const banner = document.getElementById('done-banner');
      if (!banner.textContent) {
        banner.style.display = 'block';
        banner.textContent = 'Run complete.';
      }
      break;
    }
  }
}

function addResult(evt) {
  const s = ensurePlatformCol(evt.platform);
  if (evt.status === 'applied') s.applied++;
  else if (evt.status === 'needs_review') s.reviewed++;
  else if (evt.status === 'failed') s.failed++;
  else s.skipped++;
  updatePlatformStatus(evt.platform);

  if (evt.status === 'skipped') return; // don't clutter the feed with low-fit skips

  const results = document.getElementById('results');
  const card = document.createElement('div');
  card.className = `result-card ${evt.status}`;
  const fitPct = Math.round((evt.fit || 0) * 100);
  const jdId = 'jd-' + Math.random().toString(36).slice(2);
  card.innerHTML = `
    <div class="result-top">
      <div>
        <div class="result-title">${escapeHtml(evt.title)}</div>
        <div class="result-company">${escapeHtml(evt.company)} &middot; ${PLATFORM_LABELS[evt.platform] || evt.platform}</div>
      </div>
      <span class="badge ${evt.status}">${evt.status.replace('_',' ')}</span>
    </div>
    <div class="meta">fit score ${fitPct}%${evt.url ? ` &middot; <a href="${escapeHtml(evt.url)}" target="_blank" style="color:var(--accent)">view posting</a>` : ''}</div>
    ${evt.reason ? `<div class="reason">${escapeHtml(evt.reason)}</div>` : ''}
    ${evt.jd ? `<span class="jd-toggle" data-target="${jdId}">Show job description</span><div class="jd-text" id="${jdId}">${escapeHtml(evt.jd)}</div>` : ''}
  `;
  results.prepend(card);

  const toggle = card.querySelector('.jd-toggle');
  if (toggle) {
    toggle.addEventListener('click', () => {
      const jd = card.querySelector('.jd-text');
      jd.classList.toggle('open');
      toggle.textContent = jd.classList.contains('open') ? 'Hide job description' : 'Show job description';
    });
  }
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
